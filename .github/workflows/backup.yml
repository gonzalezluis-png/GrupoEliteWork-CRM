name: Daily Database Backup

on:
  schedule:
    - cron: '0 8 * * *'   # 3:00 AM Colombia (UTC-5 → 08:00 UTC)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Fetch data from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          FILENAME="backup_${TIMESTAMP}.json"

          curl -sf \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            "${SUPABASE_URL}/rest/v1/kv_store?select=*" \
            -o /tmp/raw.json

          COUNT=$(jq 'length' /tmp/raw.json)
          echo "Registros: $COUNT"

          jq -n \
            --arg ts "$TIMESTAMP" \
            --arg count "$COUNT" \
            --slurpfile data /tmp/raw.json \
            '{timestamp: $ts, records: ($count|tonumber), data: $data[0]}' \
            > /tmp/${FILENAME}

          echo "FILENAME=${FILENAME}" >> $GITHUB_ENV
          echo "COUNT=${COUNT}" >> $GITHUB_ENV

      - name: Commit to backups branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Cambiar a rama backups (créala si no existe)
          git fetch origin backups 2>/dev/null \
            && git checkout backups \
            || git checkout --orphan backups && git rm -rf . --quiet

          cp /tmp/${{ env.FILENAME }} .

          # Conservar solo los últimos 30 backups
          ls -t backup_*.json 2>/dev/null | tail -n +31 | xargs rm -f || true

          git add -A
          git commit -m "backup: ${{ env.FILENAME }} · ${{ env.COUNT }} registros"
          git push origin backups

      - name: Summary
        run: |
          echo "### ✅ Backup completado" >> $GITHUB_STEP_SUMMARY
          echo "- **Archivo:** \`${{ env.FILENAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Registros:** ${{ env.COUNT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Rama:** \`backups\`" >> $GITHUB_STEP_SUMMARY
