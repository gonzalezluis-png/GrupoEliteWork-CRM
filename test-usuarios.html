<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Visual — Nodos</title>
<style>
:root {
  --bg:     #0f0f13;
  --bg2:    #16161e;
  --card:   #1c1c26;
  --card2:  #222230;
  --border: rgba(255,255,255,.09);
  --text:   #e8e8f0;
  --text2:  #7b7b9a;
  --accent: #0073ea;
  --green:  #00c875;
  --yellow: #fdab3d;
  --purple: #784bd1;
  --red:    #e2445c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; padding: 28px 32px; }

/* ── TOOLBAR ── */
.toolbar {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 18px; margin-bottom: 32px;
}
.ctrl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text2); }
.ctrl b { color: var(--accent); min-width: 34px; display: inline-block; }
input[type=range] { width: 100px; accent-color: var(--accent); cursor: pointer; }
.copy-btn {
  background: var(--accent); color: #fff;
  border: none; padding: 7px 16px; border-radius: 8px;
  font-size: 12px; font-weight: 700; cursor: pointer;
}
.copy-btn:hover { opacity: .85; }
.toolbar-right { margin-left: auto; display: flex; gap: 8px; }

/* ── GRID ── */
.grid { display: flex; flex-wrap: wrap; gap: 14px; }

/* ══════════════════════════════════
   ORG NODE  ← edita aquí
══════════════════════════════════ */
.org-node {
  display: inline-flex; align-items: flex-start; gap: 10px;
  background: var(--card); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 6px 10px;
  width: 210px; flex-shrink: 0;
  transition: border-color .15s, box-shadow .15s;
  box-shadow: 0 1px 4px rgba(0,0,0,.18);
}
.org-node:hover { border-color: var(--accent); box-shadow: 0 2px 12px rgba(0,115,234,.15); }

.org-node-admin            { border-color: var(--accent); }
.org-node-master_manager   { border-color: #00b7c3; }
.org-node-manager          { border-color: var(--green); }
.org-node-supervisor_agent { border-color: #ff8c00; }
.org-node-agent            { border-color: var(--border); }
.org-node-inactive         { opacity: .45; filter: grayscale(.6); }

.org-avatar {
  width: 37px; height: 37px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; color: #fff; flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(0,0,0,.3);
}
.org-node-info { flex: 1; min-width: 0; }
.org-node-name  { font-size: 11px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.org-node-email { font-size: 10px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

.role-badge { font-size: 9px; font-weight: 700; border-radius: 6px; padding: 2px 7px; margin-top: 4px; display: inline-block; letter-spacing: .3px; }
.role-admin            { background: rgba(0,115,234,.18);  color: var(--accent); }
.role-master_manager   { background: rgba(0,183,195,.18);  color: #00b7c3; }
.role-manager          { background: rgba(0,200,117,.18);  color: var(--green); }
.role-supervisor_agent { background: rgba(255,140,0,.18);  color: #ff8c00; }
.role-agent            { background: rgba(120,75,209,.18); color: #a78bfa; }

.badge-inactive { background: rgba(255,80,80,.18); color: #ff6b6b; font-size: 8px; font-weight: 700; border-radius: 4px; padding: 1px 5px; margin-left: 4px; }

/* ── MENÚ DESPLEGABLE ── */
.node-menu-wrap { position: relative; margin-top: 7px; }
.node-menu-btn {
  background: rgba(255,255,255,.06); border: 1px solid var(--border);
  color: var(--text2); cursor: pointer; font-size: 11px; font-weight: 700;
  padding: 2px 7px; border-radius: 6px; letter-spacing: 2px;
  transition: background .12s, color .12s; line-height: 1;
}
.node-menu-btn:hover { background: rgba(255,255,255,.12); color: var(--text); }
.node-menu {
  display: none; position: absolute; top: calc(100% + 6px); left: 0;
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 10px; min-width: 170px; z-index: 99;
  box-shadow: 0 8px 24px rgba(0,0,0,.45); overflow: hidden;
}
.node-menu.open { display: block; }
.node-menu button {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: transparent; border: none; color: var(--text);
  cursor: pointer; font-size: 12px; padding: 9px 14px;
  text-align: left; transition: background .1s;
}
.node-menu button:hover { background: rgba(255,255,255,.07); }
.node-menu button .mi { font-size: 15px; width: 18px; text-align: center; }
.node-menu-sep { height: 1px; background: var(--border); margin: 3px 0; }
.node-menu button.danger { color: var(--red); }

/* ── SECTION LABEL ── */
.sec { font-size: 10px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; margin: 28px 0 14px; }

/* ── ORG TREE ── */
.org-h-scroll   { overflow-x: auto; padding-bottom: 24px; }
.org-h-group    { display: inline-flex; flex-direction: column; align-items: center; }
.org-h-hline    { width: 2px; height: 20px; background: var(--border); margin: 0 auto; }
.org-h-vbar     { height: 2px; background: var(--border); align-self: stretch; }
.org-h-children { display: flex; align-items: flex-start; }
.org-h-child    { display: flex; flex-direction: column; align-items: center; padding: 0 10px; }
.org-h-child-hline { width: 2px; height: 20px; background: var(--border); }
</style>
</head>
<body>

<!-- CONTROLES -->
<div class="toolbar">
  <div class="ctrl">Ancho <input type="range" min="160" max="360" value="210" oninput="setWidth(+this.value)"> <b id="v-w">210px</b></div>
  <div class="ctrl">Fuente <input type="range" min="9" max="18" value="11" oninput="setFont(+this.value)"> <b id="v-f">11px</b></div>
  <div class="ctrl">Padding <input type="range" min="4" max="22" value="6" oninput="setPad(+this.value)"> <b id="v-p">6px</b></div>
  <div class="ctrl">Avatar <input type="range" min="28" max="56" value="37" oninput="setAv(+this.value)"> <b id="v-a">37px</b></div>
  <div class="toolbar-right">
    <button class="copy-btn" onclick="copyCSS()">📋 Copiar CSS</button>
  </div>
</div>

<!-- ORG TREE -->
<div class="sec">Árbol organizacional</div>
<div class="org-h-scroll">
  <div class="org-h-group" id="org-root"></div>
</div>

<!-- CARDS PLANAS -->
<div class="sec">Todos los nodos</div>
<div class="grid" id="cards"></div>

<script>
const USERS = [
  { id:'admin1', name:'Caritza Rojas',            email:'cjra1506@gmail.com',             role:'admin' },
  { id:'mga1',   name:'Alexander Jiménez',         email:'alexanderjimenez88@gmail.com',   role:'master_manager', orgAdminId:'admin1' },
  { id:'mga2',   name:'Maria Lugo',               email:'mariaclugorincon@gmail.com',     role:'master_manager', orgAdminId:'admin1' },
  { id:'mgr1',   name:'Estefany Chacha',           email:'estefanychachaoc@gmail.com',     role:'manager',        orgAdminId:'admin1', orgMasterManagerId:'mga1' },
  { id:'mgr2',   name:'Augusto',                  email:'augusto@gmail.com',              role:'manager',        orgAdminId:'admin1', orgMasterManagerId:'mga1' },
  { id:'sa1',    name:'Yarlys',                   email:'yarlys@gmail.com',               role:'supervisor_agent', orgAdminId:'admin1', orgManagerId:'mgr1' },
  { id:'sa2',    name:'Bryan Palacios',            email:'bryanpalaciossap@gmail.com',     role:'supervisor_agent', orgAdminId:'admin1', orgManagerId:'mgr1' },
  { id:'sa3',    name:'Selene Quiñones',           email:'selenequinones643@gmail.com',    role:'supervisor_agent', orgAdminId:'admin1', orgManagerId:'mgr2', inactive:true },
  { id:'ag1',    name:'Kenia',                    email:'kenia@gmail.com',                role:'agent', orgAdminId:'admin1', orgSupervisorId:'sa1' },
  { id:'ag2',    name:'Yarisleidy',               email:'yarisleidy@gmail.com',           role:'agent', orgAdminId:'admin1', orgSupervisorId:'sa1' },
  { id:'ag3',    name:'Madison Zarate',            email:'madisonz7781@gmail.com',         role:'agent', orgAdminId:'admin1', orgSupervisorId:'sa2' },
  { id:'ag4',    name:'Lizbeth Sánchez Nungaray',  email:'dr.lizbeth28@outlook.com',       role:'agent', orgAdminId:'admin1', orgSupervisorId:'sa2', inactive:true },
  { id:'ag5',    name:'Neyda',                    email:'neyda@gmail.com',                role:'agent', orgAdminId:'admin1', orgSupervisorId:'sa3' },
  { id:'ag6',    name:'Elizabeth',                email:'elizabeth@gmail.com',            role:'agent', orgAdminId:'admin1', orgManagerId:'mgr2' },
];

const AV_BG = { admin:'var(--accent)', master_manager:'#00b7c3', manager:'var(--green)', supervisor_agent:'#ff8c00', agent:'var(--purple)' };
const LABEL  = { admin:'Admin', master_manager:'MGA', manager:'GA', supervisor_agent:'SA', agent:'Agente' };

function initials(n) { return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase(); }

function nodeHTML(u) {
  const cls = `org-node org-node-${u.role}${u.inactive?' org-node-inactive':''}`;
  return `<div class="${cls}">
    <div class="org-avatar" style="background:${AV_BG[u.role]}">${initials(u.name)}</div>
    <div class="org-node-info">
      <div class="org-node-name">${u.name}${u.inactive?'<span class="badge-inactive">INACTIVO</span>':''}</div>
      <div class="org-node-email">${u.email}</div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
        <span class="role-badge role-${u.role}" style="margin-top:0">${LABEL[u.role]}</span>
        <div class="node-menu-wrap" style="margin-top:0">
        <button class="node-menu-btn" onclick="toggleMenu(this)">···</button>
        <div class="node-menu">
          <button><span class="mi">📊</span> Ver resumen</button>
          <button><span class="mi">👁</span> Ver como este usuario</button>
          <button><span class="mi">✏️</span> Editar usuario</button>
          <button><span class="mi">${u.inactive?'▶️':'⏸'}</span> ${u.inactive?'Activar':'Pausar'} usuario</button>
          <div class="node-menu-sep"></div>
          <button class="danger"><span class="mi">🗑</span> Eliminar usuario</button>
        </div>
      </div>
      </div>
    </div>
  </div>`;
}

document.getElementById('cards').innerHTML = USERS.map(nodeHTML).join('');

// ── ORG TREE ────────────────────────────────────────────────
function hWrap(nodeHtml, childrenHtml) {
  if (!childrenHtml) return `<div class="org-h-group">${nodeHtml}</div>`;
  return `<div class="org-h-group">${nodeHtml}
    <div class="org-h-hline"></div>
    <div class="org-h-vbar"></div>
    <div class="org-h-children">${childrenHtml}</div>
  </div>`;
}
function hChild(html) {
  return `<div class="org-h-child"><div class="org-h-child-hline"></div>${html}</div>`;
}
function buildTree() {
  const admin = USERS.find(u => u.role === 'admin');
  const mgas  = USERS.filter(u => u.role === 'master_manager');
  const mgrs  = USERS.filter(u => u.role === 'manager');
  const sas   = USERS.filter(u => u.role === 'supervisor_agent');
  const ags   = USERS.filter(u => u.role === 'agent');

  function saTree(sa) {
    const kids = ags.filter(a => a.orgSupervisorId === sa.id).map(a => hChild(hWrap(nodeHTML(a), ''))).join('');
    return hWrap(nodeHTML(sa), kids);
  }
  function mgrTree(mgr) {
    const subSas   = sas.filter(s => s.orgManagerId === mgr.id);
    const directAg = ags.filter(a => a.orgManagerId === mgr.id && !a.orgSupervisorId);
    const kids = [...subSas.map(s => hChild(saTree(s))), ...directAg.map(a => hChild(hWrap(nodeHTML(a), '')))].join('');
    return hWrap(nodeHTML(mgr), kids);
  }
  function mgaTree(mga) {
    const kids = mgrs.filter(m => m.orgMasterManagerId === mga.id).map(m => hChild(mgrTree(m))).join('');
    return hWrap(nodeHTML(mga), kids);
  }
  const adminKids = mgas.map(m => hChild(mgaTree(m))).join('');
  document.getElementById('org-root').innerHTML = hWrap(nodeHTML(admin), adminKids);
}
buildTree();

function all(s) { return document.querySelectorAll(s); }
function setWidth(v) { all('.org-node').forEach(el => el.style.width=v+'px'); document.getElementById('v-w').textContent=v+'px'; }
function setFont(v)  { all('.org-node-name').forEach(el => el.style.fontSize=v+'px'); document.getElementById('v-f').textContent=v+'px'; }
function setPad(v)   { all('.org-node').forEach(el => el.style.padding=`${v}px ${v+4}px`); document.getElementById('v-p').textContent=v+'px'; }
function setAv(v)    { all('.org-avatar').forEach(el => { el.style.width=v+'px'; el.style.height=v+'px'; el.style.fontSize=Math.round(v*.37)+'px'; }); document.getElementById('v-a').textContent=v+'px'; }

function toggleMenu(btn) {
  const menu = btn.nextElementSibling;
  const isOpen = menu.classList.contains('open');
  document.querySelectorAll('.node-menu.open').forEach(m => m.classList.remove('open'));
  if (!isOpen) menu.classList.add('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.node-menu-wrap')) {
    document.querySelectorAll('.node-menu.open').forEach(m => m.classList.remove('open'));
  }
});

function copyCSS() {
  const n = document.querySelector('.org-node');
  const nm = document.querySelector('.org-node-name');
  const av = document.querySelector('.org-avatar');
  const css = `.org-node { width:${n?.style.width||'260px'}; padding:${n?.style.padding||'10px 14px'}; }
.org-node-name { font-size:${nm?.style.fontSize||'13px'}; }
.org-avatar { width:${av?.style.width||'36px'}; height:${av?.style.height||'36px'}; font-size:${av?.style.fontSize||'13px'}; }`;
  navigator.clipboard.writeText(css).then(()=>alert('✅ CSS copiado'));
}
</script>
</body>
</html>
